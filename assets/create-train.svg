<svg xmlns="http://www.w3.org/2000/svg" width="780" height="230" viewBox="0 0 780 230" role="img" aria-labelledby="title desc">
<title id="title">Train construit avec des blocs, inspiré du mod Create</title>
<desc id="desc">Locomotive mécanique en métal, bois et laiton, suivie d'un wagon, posée sur quatre bogies à roues animées.</desc>
<defs>
  <linearGradient id="steel" x1="0" x2=".7" y1="0" y2="1"><stop stop-color="#636f70"/><stop offset=".42" stop-color="#43545b"/><stop offset="1" stop-color="#222e36"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fce3a4"/><stop offset=".5" stop-color="#c6944d"/><stop offset="1" stop-color="#7d522a"/></linearGradient>
  <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8e6742"/><stop offset=".65" stop-color="#69482e"/><stop offset="1" stop-color="#3a302a"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d1eeec"/><stop offset=".32" stop-color="#4d8d9a"/><stop offset="1" stop-color="#142e40"/></linearGradient>
  <filter id="lamp" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="planks" width="34" height="20" patternUnits="userSpaceOnUse"><path d="M0 1H34M0 20V1" stroke="#d1a46a" stroke-opacity=".17" stroke-width="3"/></pattern>
  <style><![CDATA[
    .wheel-spin{transform-box:fill-box;transform-origin:center;animation:spin 1.25s linear infinite}
    @keyframes spin{to{transform:rotate(-360deg)}}
    @media(prefers-reduced-motion:reduce){.wheel-spin{animation:none}}
  ]]></style>
</defs>
